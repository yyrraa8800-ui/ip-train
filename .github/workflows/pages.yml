name: Deploy app to GitHub Pages

# Publishes the self-contained app (dist/) to GitHub Pages so it has a clean,
# permanent, tappable URL: https://<owner>.github.io/ip-train/
#
# One-time setup by the repo owner:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# After that, every push to the default branch re-publishes automatically.

on:
  push:
    branches: ['claude/iphone-testflight-build-mq2339']
    paths: ['dist/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the built app (dist/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
