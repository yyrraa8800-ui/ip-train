<title>Infinite</title>
<style>/* Infinite — global styles. Dark training-instrument aesthetic. */

:root {
  --bg: #0b0b0e;
  --surface: #15161b;
  --surface2: #1d1f26;
  --surface3: #23252e;
  --line: #2a2c36;
  --text: #f4f4f6;
  --dim: #9a9ca6;
  --faint: #5a5c66;
  --alive: #7cff3f;
  --slowing: #ffb020;
  --ended: #ff4d4d;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body,
#root {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  overscroll-behavior-y: none;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

#root {
  display: flex;
  flex-direction: column;
  max-width: 560px;
  margin: 0 auto;
  overflow: hidden;
}

[dir='rtl'] {
  direction: rtl;
}

button {
  font: inherit;
  color: inherit;
  border: none;
  background: none;
  cursor: pointer;
}

a {
  color: var(--alive);
  text-decoration: none;
}

input,
textarea {
  font: inherit;
  color: var(--text);
}

/* Numbers are the hero. */
.num {
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1, 'lnum' 1;
  letter-spacing: -0.01em;
}
.bignum {
  font-variant-numeric: tabular-nums;
  font-weight: 800;
  letter-spacing: -0.03em;
}

/* Layout */
.screen {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: calc(var(--safe-top) + 12px) 16px calc(var(--safe-bottom) + 96px);
}
.screen-pad-sm {
  padding-bottom: calc(var(--safe-bottom) + 24px);
}

.h1 {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 4px 0 2px;
}
.h2 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 18px 0 10px;
}
.label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--dim);
  font-weight: 600;
}
.dim {
  color: var(--dim);
}
.faint {
  color: var(--faint);
}
.center {
  text-align: center;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.row-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.col {
  display: flex;
  flex-direction: column;
}
.wrap {
  flex-wrap: wrap;
}
.gap6 {
  gap: 6px;
}
.gap12 {
  gap: 12px;
}
.mt8 {
  margin-top: 8px;
}
.mt16 {
  margin-top: 16px;
}
.grow {
  flex: 1;
}

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
}
.card2 {
  background: var(--surface2);
  border-radius: 14px;
  padding: 14px;
}
.tappable {
  transition: transform 0.08s ease, background 0.15s ease;
}
.tappable:active {
  transform: scale(0.98);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 14px;
  padding: 14px 18px;
  font-weight: 700;
  font-size: 16px;
  background: var(--surface2);
  border: 1px solid var(--line);
}
.btn-primary {
  background: var(--alive);
  color: #0b1206;
  border-color: var(--alive);
}
.btn-ghost {
  background: transparent;
}
.btn-block {
  width: 100%;
}
.btn-danger {
  color: var(--ended);
  border-color: #4a2630;
}
.btn:disabled {
  opacity: 0.4;
}

/* Pills / chips */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--surface2);
  border: 1px solid var(--line);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}
.chip-on {
  background: var(--alive);
  color: #0b1206;
  border-color: var(--alive);
}
.dot {
  width: 9px;
  height: 9px;
  border-radius: 999px;
  flex: none;
}

/* Tab bar */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  background: rgba(15, 16, 21, 0.92);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding-bottom: var(--safe-bottom);
  z-index: 50;
}
.tabbtn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 9px 0 7px;
  color: var(--faint);
  font-size: 10px;
  font-weight: 600;
}
.tabbtn.on {
  color: var(--alive);
}
.tabicon {
  font-size: 20px;
  line-height: 1;
}

/* Inputs */
.stepper {
  display: flex;
  align-items: center;
  background: var(--surface3);
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.stepper button {
  width: 38px;
  height: 52px;
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  flex: none;
}
.stepper .val {
  flex: 1;
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  min-width: 40px;
}
.field {
  background: var(--surface3);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  width: 100%;
}
.toggle {
  width: 52px;
  height: 30px;
  border-radius: 999px;
  background: var(--surface3);
  border: 1px solid var(--line);
  position: relative;
  transition: background 0.15s ease;
}
.toggle.on {
  background: var(--alive);
}
.toggle .knob {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 22px;
  height: 22px;
  border-radius: 999px;
  background: #fff;
  transition: left 0.15s ease;
}
.toggle.on .knob {
  left: 25px;
}
[dir='rtl'] .toggle .knob {
  left: auto;
  right: 3px;
}
[dir='rtl'] .toggle.on .knob {
  right: 25px;
}

/* Life-cycle runway bar */
.runway {
  height: 8px;
  border-radius: 999px;
  background: var(--surface3);
  overflow: hidden;
  position: relative;
}
.runway > span {
  position: absolute;
  inset: 0;
  border-radius: 999px;
}

/* Sheet / modal */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet {
  width: 100%;
  max-width: 560px;
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  border-top: 1px solid var(--line);
  padding: 18px 16px calc(var(--safe-bottom) + 18px);
  max-height: 88vh;
  overflow-y: auto;
  animation: slideup 0.22s ease;
}
@keyframes slideup {
  from {
    transform: translateY(100%);
  }
}
@keyframes ringfill {
  from {
    stroke-dashoffset: var(--circ);
  }
}

.header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(var(--safe-top) + 10px) 16px 8px;
}
.backbtn {
  font-size: 22px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: var(--surface2);
}
[dir='rtl'] .backbtn {
  transform: scaleX(-1);
}

.divider {
  height: 1px;
  background: var(--line);
  margin: 14px 0;
}
.spark {
  display: block;
}
.muted-banner {
  background: var(--surface2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  color: var(--dim);
  font-size: 14px;
}
.tag {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--surface3);
  color: var(--dim);
  font-weight: 600;
}
.fab {
  position: fixed;
  bottom: calc(var(--safe-bottom) + 78px);
  inset-inline-end: 16px;
  z-index: 40;
}
</style>
</head>
