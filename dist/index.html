<title>Infinite</title>
<style>/* Infinite — global styles. Dark training-instrument aesthetic. */

:root {
  --bg: #0b0b0e;
  --surface: #15161b;
  --surface2: #1d1f26;
  --surface3: #23252e;
  --line: #2a2c36;
  --text: #f4f4f6;
  --dim: #9a9ca6;
  --faint: #5a5c66;
  --alive: #7cff3f;
  --slowing: #ffb020;
  --ended: #ff4d4d;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body,
#root {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  overscroll-behavior-y: none;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Pin the whole app to the visual viewport. Using a fixed, inset:0 flex column
   (instead of height:100% + a position:fixed tab bar) avoids the iOS standalone
   PWA "gap at the bottom" where bottom:0 doesn't reach the true screen edge. */
#root {
  position: fixed;
  inset: 0;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

[dir='rtl'] {
  direction: rtl;
}

button {
  font: inherit;
  color: inherit;
  border: none;
  background: none;
  cursor: pointer;
}

a {
  color: var(--alive);
  text-decoration: none;
}

input,
textarea {
  font: inherit;
  color: var(--text);
}

/* Numbers are the hero. */
.num {
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1, 'lnum' 1;
  letter-spacing: -0.01em;
}
.bignum {
  font-variant-numeric: tabular-nums;
  font-weight: 800;
  letter-spacing: -0.03em;
}

/* Layout */
.screen {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: calc(var(--safe-top) + 12px) 16px calc(var(--safe-bottom) + 28px);
}
.screen-pad-sm {
  padding-bottom: calc(var(--safe-bottom) + 24px);
}

.h1 {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 4px 0 2px;
}
.h2 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 18px 0 10px;
}
.label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--dim);
  font-weight: 600;
}
.dim {
  color: var(--dim);
}
.faint {
  color: var(--faint);
}
.center {
  text-align: center;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.row-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.col {
  display: flex;
  flex-direction: column;
}
.wrap {
  flex-wrap: wrap;
}
.gap6 {
  gap: 6px;
}
.gap12 {
  gap: 12px;
}
.mt8 {
  margin-top: 8px;
}
.mt16 {
  margin-top: 16px;
}
.grow {
  flex: 1;
}

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
}
.card2 {
  background: var(--surface2);
  border-radius: 14px;
  padding: 14px;
}
.tappable {
  transition: transform 0.08s ease, background 0.15s ease;
}
.tappable:active {
  transform: scale(0.98);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 14px;
  padding: 14px 18px;
  font-weight: 700;
  font-size: 16px;
  background: var(--surface2);
  border: 1px solid var(--line);
}
.btn-primary {
  background: var(--alive);
  color: #0b1206;
  border-color: var(--alive);
}
.btn-ghost {
  background: transparent;
}
.btn-block {
  width: 100%;
}
.btn-danger {
  color: var(--ended);
  border-color: #4a2630;
}
.btn:disabled {
  opacity: 0.4;
}

/* Pills / chips */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--surface2);
  border: 1px solid var(--line);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}
.chip-on {
  background: var(--alive);
  color: #0b1206;
  border-color: var(--alive);
}
.dot {
  width: 9px;
  height: 9px;
  border-radius: 999px;
  flex: none;
}

/* Tab bar */
.tabbar {
  flex: none;
  display: flex;
  background: rgba(17, 18, 24, 0.98);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding-bottom: var(--safe-bottom);
  z-index: 50;
}
.tabbtn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 9px 0 7px;
  color: var(--faint);
  font-size: 10px;
  font-weight: 600;
}
.tabbtn.on {
  color: var(--alive);
}
.tabicon {
  font-size: 20px;
  line-height: 1;
}

/* Inputs */
.stepper {
  display: flex;
  align-items: center;
  background: var(--surface3);
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.stepper button {
  width: 38px;
  height: 52px;
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  flex: none;
}
.stepper .val {
  flex: 1;
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  min-width: 40px;
}
.field {
  background: var(--surface3);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  width: 100%;
}
.toggle {
  width: 52px;
  height: 30px;
  border-radius: 999px;
  background: var(--surface3);
  border: 1px solid var(--line);
  position: relative;
  transition: background 0.15s ease;
}
.toggle.on {
  background: var(--alive);
}
.toggle .knob {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 22px;
  height: 22px;
  border-radius: 999px;
  background: #fff;
  transition: left 0.15s ease;
}
.toggle.on .knob {
  left: 25px;
}
[dir='rtl'] .toggle .knob {
  left: auto;
  right: 3px;
}
[dir='rtl'] .toggle.on .knob {
  right: 25px;
}

/* Life-cycle runway bar */
.runway {
  height: 8px;
  border-radius: 999px;
  background: var(--surface3);
  overflow: hidden;
  position: relative;
}
.runway > span {
  position: absolute;
  inset: 0;
  border-radius: 999px;
}

/* Sheet / modal */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet {
  width: 100%;
  max-width: 560px;
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  border-top: 1px solid var(--line);
  padding: 18px 16px calc(var(--safe-bottom) + 18px);
  max-height: 88vh;
  overflow-y: auto;
  animation: slideup 0.22s ease;
}
@keyframes slideup {
  from {
    transform: translateY(100%);
  }
}
@keyframes ringfill {
  from {
    stroke-dashoffset: var(--circ);
  }
}

.header {
  display: flex;
  align-items: center;
  gap: 10px;
  /* The parent .screen already provides the top safe-area inset. */
  padding: 4px 16px 8px;
}
.backbtn {
  font-size: 22px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: var(--surface2);
}
[dir='rtl'] .backbtn {
  transform: scaleX(-1);
}

.divider {
  height: 1px;
  background: var(--line);
  margin: 14px 0;
}
.spark {
  display: block;
}
.muted-banner {
  background: var(--surface2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  color: var(--dim);
  font-size: 14px;
}
.tag {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--surface3);
  color: var(--dim);
  font-weight: 600;
}
.fab {
  position: fixed;
  bottom: calc(var(--safe-bottom) + 78px);
  inset-inline-end: 16px;
  z-index: 40;
}
</style>

ck mt16",onClick:()=>T.push({name:"guide"}),children:["\u{1F4D6} ",e("read_guide")]}),(0,de.jsx)("div",{className:"h2",children:e("ip_method")}),(0,de.jsxs)("div",{className:"card2",style:{lineHeight:1.6,fontSize:14},children:[(0,de.jsx)("p",{style:{marginTop:0},children:"The IP Method (Jon Walland) organises training around six movement patterns. Each exercise variation is productive only for a window: you push it with double progression until it stalls \u2014 its life cycle ends \u2014 then swap to a same-pattern variation that attacks the weak point the last one exposed. Strength carries forward, and your most effective variations get cycled back in."}),(0,de.jsxs)("p",{style:{marginBottom:0},children:["Rotation is triggered by ",(0,de.jsx)("strong",{children:"stagnation, not by whim"}),": frequent swapping makes progressive overload impossible to track, so this app only nudges a swap once a lift has genuinely stalled."]})]}),(0,de.jsx)("div",{className:"h2",children:"Disclaimer"}),(0,de.jsx)("div",{className:"muted-banner",style:{lineHeight:1.6},children:e("disclaimer")}),(0,de.jsxs)("div",{className:"faint center mt16",style:{fontSize:11,paddingBottom:24},children:["Generated ",new Date(W.meta.generatedAt).toLocaleDateString()," \xB7 ",W.meta.note]})]})]})}var iw={title:"How Infinite works",intro:"Infinite turns the IP Method into an automatic loop and grounds every rule in training science. Here is the method, the evidence behind it, and exactly how you apply it.",sections:[{h:"1 \xB7 The IP Method, in one loop",p:["Your physique is governed by six movement patterns: horizontal press, horizontal pull, vertical press, vertical pull, squat, and hinge. Treat each like a skill you level up. Smaller isolation muscles (side and rear delts, biceps, triceps, calves, abs, traps) are tracked on the side.",'Every exercise variation is only productive for a window. While you keep adding weight or reps it is "alive" (green). When progress stalls, its life cycle has "ended" (red) \u2014 grinding it past that point yields little.',"The loop: run one variation with double progression \u2192 it stalls \u2192 swap to a same-pattern variation that fixes the weak point the last one exposed \u2192 your strength carries forward \u2192 over time you build a roster of your best variations and cycle them back in."]},{h:"2 \xB7 Why it builds muscle (the evidence)",p:["Progressive overload \u2014 gradually doing more over time \u2014 is the main driver of growth. In a fixed 6\u201312 rep range you use double progression: add reps until you reach the top of the range, then add the smallest weight jump and let reps reset toward the bottom.","Because both weight and reps move, the app tracks estimated 1-rep-max (e1RM, Epley formula) as one clean progress signal \u2014 so a day where weight goes up but reps go down still counts correctly.","Most working sets should stop about 0\u20133 reps short of failure (RIR 0\u20133) \u2014 enough to grow without burying you in fatigue. You can log RIR per set in the logger.","Volume matters per muscle, per week. The app compares your weekly hard sets to landmarks \u2014 MEV (minimum effective), MAV (the productive window), and MRV (above which it is junk volume) \u2014 and flags each muscle as below / in range / above.","Fatigue accumulates, so sets ramp across the block and then a deload week lets you recover and realise the gains before the next block starts.","Rotation works \u2014 but only on a stall. Swapping exercises too often makes progressive overload impossible to track, so the app only suggests a swap once a lift has genuinely ended. Rotate on stagnation, not on a whim."]},{h:"3 \xB7 How you apply it, week to week",p:["Open the Today tab, pick the day, and tap Start workout.","Do the warm-ups shown, then log each working set with the weight/reps steppers. Try to beat last time\u2019s faint \u201Cghost\u201D numbers. Tap the green check to finish a set \u2014 the rest timer slides up automatically.","Each lift is auto-rated 1 (you beat last session) or 0 (you didn\u2019t). Watch its life-cycle bar fill green \u2192 amber \u2192 red.","When a bar turns red (ended), open the lift and tap Swap. Say where you usually fail; the app offers three same-pattern options that target that weak point, pre-filled with a sensible starting weight. Pick one and keep progressing.","Check the Weekly volume screen to keep each muscle inside its productive band. At the deload week, recover \u2014 then generate the next block and your best variations rotate back in automatically."]},{h:"4 \xB7 Reading the screens",p:["Green = progressing, amber = slowing, red = cycle ended. Colour is always paired with a label or icon, never used alone.","The ring on each pattern is your level from total strength gained. The runway bar shows how close a lift is to needing a swap. The sparkline is its recent e1RM trend.","Everything is stored on your device and works offline. Back up anytime with Settings \u2192 Export data."]}]},sw={title:"\u0643\u064A\u0641 \u064A\u0639\u0645\u0644 \u0625\u0646\u0641\u064A\u0646\u064A\u062A",intro:"\u064A\u062D\u0648\u0651\u0644 \u0625\u0646\u0641\u064A\u0646\u064A\u062A \u0637\u0631\u064A\u0642\u0629 IP \u0625\u0644\u0649 \u062D\u0644\u0642\u0629 \u062A\u0644\u0642\u0627\u0626\u064A\u0629\u060C \u0648\u064A\u0628\u0646\u064A \u0643\u0644 \u0642\u0627\u0639\u062F\u0629 \u0639\u0644\u0649 \u0639\u0644\u0645 \u0627\u0644\u062A\u062F\u0631\u064A\u0628. \u0625\u0644\u064A\u0643 \u0627\u0644\u0637\u0631\u064A\u0642\u0629\u060C \u0648\u0627\u0644\u0623\u062F\u0644\u0629 \u062E\u0644\u0641\u0647\u0627\u060C \u0648\u0643\u064A\u0641 \u062A\u0637\u0628\u0651\u0642\u0647\u0627 \u0628\u0627\u0644\u0636\u0628\u0637.",sections:[{h:"\u0661 \xB7 \u0637\u0631\u064A\u0642\u0629 IP \u0641\u064A \u062D\u0644\u0642\u0629 \u0648\u0627\u062D\u062F\u0629",p:["\u064A\u062D\u0643\u0645 \u062C\u0633\u0645\u0643 \u0633\u062A\u0629 \u0623\u0646\u0645\u0627\u0637 \u062D\u0631\u0643\u064A\u0629: \u062F\u0641\u0639 \u0623\u0641\u0642\u064A\u060C \u0633\u062D\u0628 \u0623\u0641\u0642\u064A\u060C \u062F\u0641\u0639 \u0631\u0623\u0633\u064A\u060C \u0633\u062D\u0628 \u0631\u0623\u0633\u064A\u060C \u0633\u0643\u0648\u0627\u062A\u060C \u0648\u0645\u0641\u0635\u0644\u0629 \u0627\u0644\u0648\u0631\u0643. \u062A\u0639\u0627\u0645\u0644 \u0645\u0639 \u0643\u0644 \u0646\u0645\u0637 \u0643\u0645\u0647\u0627\u0631\u0629 \u062A\u0637\u0648\u0651\u0631\u0647\u0627. \u0623\u0645\u0627 \u0639\u0636\u0644\u0627\u062A \u0627\u0644\u0639\u0632\u0644 \u0627\u0644\u0623\u0635\u063A\u0631 (\u0627\u0644\u0643\u062A\u0641 \u0627\u0644\u062C\u0627\u0646\u0628\u064A \u0648\u0627\u0644\u062E\u0644\u0641\u064A\u060C \u0627\u0644\u0628\u0627\u064A\u0633\u0628\u0633\u060C \u0627\u0644\u062A\u0631\u0627\u064A\u0633\u0628\u0633\u060C \u0627\u0644\u0633\u0645\u0627\u0646\u0629\u060C \u0627\u0644\u0628\u0637\u0646\u060C \u0627\u0644\u062A\u0631\u0627\u0628\u064A\u0633) \u0641\u062A\u064F\u062A\u0627\u0628\u064E\u0639 \u0628\u0634\u0643\u0644 \u0645\u0646\u0641\u0635\u0644.","\u0643\u0644 \u062A\u0645\u0631\u064A\u0646 \u0645\u0641\u064A\u062F \u0644\u0641\u062A\u0631\u0629 \u0645\u062D\u062F\u0648\u062F\u0629 \u0641\u0642\u0637. \u0645\u0627 \u062F\u0645\u062A \u062A\u0632\u064A\u062F \u0627\u0644\u0648\u0632\u0646 \u0623\u0648 \u0627\u0644\u062A\u0643\u0631\u0627\u0631\u0627\u062A \u0641\u0647\u0648 \xAB\u062D\u064A\u0651\xBB (\u0623\u062E\u0636\u0631). \u0648\u0639\u0646\u062F\u0645\u0627 \u064A\u062A\u0648\u0642\u0641 \u0627\u0644\u062A\u0642\u062F\u0645 \u062A\u0643\u0648\u0646 \u062F\u0648\u0631\u062A\u0647 \u0642\u062F \xAB\u0627\u0646\u062A\u0647\u062A\xBB (\u0623\u062D\u0645\u0631)\u060C \u0648\u0627\u0644\u0625\u0635\u0631\u0627\u0631 \u0639\u0644\u064A\u0647 \u0628\u0639\u062F \u0630\u0644\u0643 \u0642\u0644\u064A\u0644 \u0627\u0644\u0641\u0627\u0626\u062F\u0629.","\u0627\u0644\u062D\u0644\u0642\u0629: \u062F\u0631\u0651\u0628 \u062A\u0645\u0631\u064A\u0646\u064B\u0627 \u0628\u0627\u0644\u062A\u062F\u0631\u0651\u062C \u0627\u0644\u0645\u0632\u062F\u0648\u062C \u2190 \u064A\u062A\u0648\u0642\u0641 \u2190 \u0628\u062F\u0651\u0644 \u0625\u0644\u0649 \u062A\u0645\u0631\u064A\u0646 \u0645\u0646 \u0646\u0641\u0633 \u0627\u0644\u0646\u0645\u0637 \u064A\u0639\u0627\u0644\u062C \u0646\u0642\u0637\u0629 \u0627\u0644\u0636\u0639\u0641 \u0627\u0644\u062A\u064A \u0643\u0634\u0641\u0647\u0627 \u0627\u0644\u0633\u0627\u0628\u0642 \u2190 \u062A\u0646\u062A\u0642\u0644 \u0642\u0648\u062A\u0643 \u0644\u0644\u0623\u0645\u0627\u0645 \u2190 \u0648\u0645\u0639 \u0627\u0644\u0648\u0642\u062A \u062A\u0628\u0646\u064A \u0642\u0627\u0626\u0645\u0629 \u0628\u0623\u0641\u0636\u0644 \u062A\u0645\u0627\u0631\u064A\u0646\u0643 \u0648\u062A\u0639\u064A\u062F \u0625\u062F\u062E\u0627\u0644\u0647\u0627."]},{h:"\u0662 \xB7 \u0644\u0645\u0627\u0630\u0627 \u064A\u0628\u0646\u064A \u0627\u0644\u0639\u0636\u0644\u0627\u062A (\u0627\u0644\u0623\u062F\u0644\u0629)",p:["\u0627\u0644\u0632\u064A\u0627\u062F\u0629 \u0627\u0644\u062A\u062F\u0631\u064A\u062C\u064A\u0629 \u2014 \u0623\u0646 \u062A\u0641\u0639\u0644 \u0623\u0643\u062B\u0631 \u062A\u062F\u0631\u064A\u062C\u064A\u064B\u0627 \u2014 \u0647\u064A \u0627\u0644\u0645\u062D\u0631\u0651\u0643 \u0627\u0644\u0623\u0633\u0627\u0633\u064A \u0644\u0644\u0646\u0645\u0648. \u0636\u0645\u0646 \u0646\u0637\u0627\u0642 \u062B\u0627\u0628\u062A \u0666\u2013\u0661\u0662 \u062A\u0643\u0631\u0627\u0631 \u062A\u0633\u062A\u062E\u062F\u0645 \u0627\u0644\u062A\u062F\u0631\u0651\u062C \u0627\u0644\u0645\u0632\u062F\u0648\u062C: \u0632\u0650\u062F \u0627\u0644\u062A\u0643\u0631\u0627\u0631\u0627\u062A \u062D\u062A\u0649 \u062A\u0628\u0644\u063A \u0623\u0639\u0644\u0649 \u0627\u0644\u0646\u0637\u0627\u0642\u060C \u062B\u0645 \u0623\u0636\u0641 \u0623\u0635\u063A\u0631 \u0632\u064A\u0627\u062F\u0629 \u0641\u064A \u0627\u0644\u0648\u0632\u0646 \u0648\u062F\u0639 \u0627\u0644\u062A\u0643\u0631\u0627\u0631\u0627\u062A \u062A\u0639\u0648\u062F \u0646\u062D\u0648 \u0627\u0644\u0623\u0633\u0641\u0644.","\u0644\u0623\u0646 \u0627\u0644\u0648\u0632\u0646 \u0648\u0627\u0644\u062A\u0643\u0631\u0627\u0631\u0627\u062A \u064A\u062A\u063A\u064A\u0631\u0627\u0646 \u0645\u0639\u064B\u0627\u060C \u064A\u062A\u062A\u0628\u0651\u0639 \u0627\u0644\u062A\u0637\u0628\u064A\u0642 \u0623\u0642\u0635\u0649 \u062A\u0643\u0631\u0627\u0631 \u062A\u0642\u062F\u064A\u0631\u064A (e1RM \u0628\u0645\u0639\u0627\u062F\u0644\u0629 \u0625\u064A\u0628\u0644\u064A) \u0643\u0625\u0634\u0627\u0631\u0629 \u062A\u0642\u062F\u0651\u0645 \u0648\u0627\u062D\u062F\u0629 \u0648\u0627\u0636\u062D\u0629 \u2014 \u062D\u062A\u0649 \u0644\u0648 \u0632\u0627\u062F \u0627\u0644\u0648\u0632\u0646 \u0648\u0646\u0642\u0635\u062A \u0627\u0644\u062A\u0643\u0631\u0627\u0631\u0627\u062A \u064A\u064F\u062D\u062A\u0633\u0628 \u0627\u0644\u062A\u0642\u062F\u0651\u0645 \u0628\u0634\u0643\u0644 \u0635\u062D\u064A\u062D.","\u064A\u064F\u0641\u0636\u0651\u0644 \u0625\u064A\u0642\u0627\u0641 \u0645\u0639\u0638\u0645 \u0627\u0644\u062C\u0648\u0644\u0627\u062A \u0639\u0644\u0649 \u0628\u064F\u0639\u062F \u0660\u2013\u0663 \u062A\u0643\u0631\u0627\u0631\u0627\u062A \u0645\u0646 \u0627\u0644\u0641\u0634\u0644 (RIR \u0660\u2013\u0663) \u2014 \u0643\u0627\u0641\u064D \u0644\u0644\u0646\u0645\u0648 \u062F\u0648\u0646 \u0625\u0631\u0647\u0627\u0642 \u0645\u0641\u0631\u0637. \u064A\u0645\u0643\u0646\u0643 \u062A\u0633\u062C\u064A\u0644 \u0627\u0644\u0640 RIR \u0644\u0643\u0644 \u062C\u0648\u0644\u0629 \u0641\u064A \u0635\u0641\u062D\u0629 \u0627\u0644\u062A\u0633\u062C\u064A\u0644.","\u0627\u0644\u062D\u062C\u0645 \u0645\u0647\u0645 \u0644\u0643\u0644 \u0639\u0636\u0644\u0629 \u0623\u0633\u0628\u0648\u0639\u064A\u064B\u0627. \u064A\u0642\u0627\u0631\u0646 \u0627\u0644\u062A\u0637\u0628\u064A\u0642 \u062C\u0648\u0644\u0627\u062A\u0643 \u0627\u0644\u0623\u0633\u0628\u0648\u0639\u064A\u0629 \u0628\u0627\u0644\u0645\u0639\u0627\u0644\u0645 \u2014 \u0627\u0644\u062D\u062F \u0627\u0644\u0623\u062F\u0646\u0649 \u0627\u0644\u0641\u0639\u0651\u0627\u0644 (MEV)\u060C \u0648\u0627\u0644\u0646\u0637\u0627\u0642 \u0627\u0644\u0645\u062B\u0645\u0631 (MAV)\u060C \u0648\u0627\u0644\u062D\u062F \u0627\u0644\u0623\u0642\u0635\u0649 \u0627\u0644\u0642\u0627\u0628\u0644 \u0644\u0644\u062A\u0639\u0627\u0641\u064A (MRV) \u0627\u0644\u0630\u064A \u064A\u0635\u0628\u062D \u0641\u0648\u0642\u0647 \u0627\u0644\u062D\u062C\u0645 \u0632\u0627\u0626\u062F\u064B\u0627 \u2014 \u0648\u064A\u0635\u0646\u0651\u0641 \u0643\u0644 \u0639\u0636\u0644\u0629: \u0623\u0642\u0644/\u0636\u0645\u0646 \u0627\u0644\u0646\u0637\u0627\u0642/\u0623\u0639\u0644\u0649.","\u064A\u062A\u0631\u0627\u0643\u0645 \u0627\u0644\u062A\u0639\u0628\u060C \u0644\u0630\u0627 \u062A\u0631\u062A\u0641\u0639 \u0627\u0644\u062C\u0648\u0644\u0627\u062A \u0639\u0628\u0631 \u0627\u0644\u0628\u0644\u0648\u0643 \u062B\u0645 \u064A\u0623\u062A\u064A \u0623\u0633\u0628\u0648\u0639 \u0627\u0644\u062F\u0651\u064A\u0644\u0648\u062F \u0644\u064A\u062A\u064A\u062D \u0627\u0644\u062A\u0639\u0627\u0641\u064A \u0648\u062A\u062D\u0642\u064A\u0642 \u0627\u0644\u0645\u0643\u0627\u0633\u0628 \u0642\u0628\u0644 \u0628\u062F\u0621 \u0627\u0644\u0628\u0644\u0648\u0643 \u0627\u0644\u062A\u0627\u0644\u064A.","\u0627\u0644\u062A\u0628\u062F\u064A\u0644 \u0645\u0641\u064A\u062F \u2014 \u0644\u0643\u0646 \u0639\u0646\u062F \u0627\u0644\u062A\u0648\u0642\u0641 \u0641\u0642\u0637. \u0627\u0644\u062A\u0628\u062F\u064A\u0644 \u0627\u0644\u0645\u062A\u0643\u0631\u0631 \u064A\u062C\u0639\u0644 \u062A\u062A\u0628\u0651\u0639 \u0627\u0644\u0632\u064A\u0627\u062F\u0629 \u0627\u0644\u062A\u062F\u0631\u064A\u062C\u064A\u0629 \u0645\u0633\u062A\u062D\u064A\u0644\u064B\u0627\u060C \u0644\u0630\u0627 \u0644\u0627 \u064A\u0642\u062A\u0631\u062D \u0627\u0644\u062A\u0637\u0628\u064A\u0642 \u0627\u0644\u062A\u0628\u062F\u064A\u0644 \u0625\u0644\u0627 \u0628\u0639\u062F \u062A\u0648\u0642\u0651\u0641 \u0627\u0644\u062A\u0645\u0631\u064A\u0646 \u0641\u0639\u0644\u0
